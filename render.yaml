services:
  - type: web
    name: aicte-fdr-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: IDENTIFIER_HASH_SALT
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
