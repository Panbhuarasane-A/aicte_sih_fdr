version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aicte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicte_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aicte_fdr_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_user -d aicte_fdr_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte_backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aicte_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/aicte_fdr_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aicte_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    container_name: aicte_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

volumes:
  pgdata:
